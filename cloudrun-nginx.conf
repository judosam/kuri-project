server {
    listen PORT_PLACEHOLDER default_server;
    listen [::]:PORT_PLACEHOLDER default_server;
    server_name _;

    # Prevent Cloud Run internal port 8080 from leaking into HTTP 301/302 redirects
    absolute_redirect off;
    port_in_redirect off;

    client_max_body_size 100M;
    client_body_buffer_size 1M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # High-Performance In-Memory File Descriptor Cache
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. User Web App Assets
    location ^~ /app/assets/ {
        alias /var/www/user-web/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 2. User Web App Manifest & Service Worker
    location = /app/manifest.webmanifest {
        alias /var/www/user-web/manifest.webmanifest;
        add_header Content-Type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /app/registerSW.js {
        alias /var/www/user-web/registerSW.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /app/sw.js {
        alias /var/www/user-web/sw.js;
        add_header Content-Type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 3. User Web App (PWA) Root
    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        alias /var/www/user-web/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 4. Admin Portal Assets
    location ^~ /assets/ {
        alias /var/www/admin/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 5. FastAPI Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
    }

    # 6. Backend Health & Docs
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 7. Static Uploaded Files
    location /uploads/ {
        alias /mnt/data/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 8. Admin Web Portal Root (Catch-all SPA)
    location / {
        root /var/www/admin;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
